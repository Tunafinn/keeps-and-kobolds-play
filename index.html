<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black">
		<meta name="theme-color" content="#140406">
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
		<link rel="manifest" href="index.manifest.json">
		<title>Keeps and Kobolds</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	height: 100%;
	height: -webkit-fill-available;
	height: 100dvh;
	background-color: #140406;
	overflow: hidden;
	touch-action: none;
}

body {
	color: #F6E7C1;
	position: fixed;
	inset: 0;
}

#canvas {
	display: block;
	position: fixed;
	top: var(--kak-inset-top, env(safe-area-inset-top, 0px));
	right: var(--kak-inset-right, env(safe-area-inset-right, 0px));
	bottom: var(--kak-inset-bottom, env(safe-area-inset-bottom, 0px));
	left: var(--kak-inset-left, env(safe-area-inset-left, 0px));
	width: auto;
	height: auto;
	touch-action: none;
	background-color: #140406;
}

#canvas:focus {
	outline: none;
}

#kak-inset-probe {
	position: fixed;
	left: 0;
	top: 0;
	width: 0;
	height: 0;
	visibility: hidden;
	pointer-events: none;
	padding-top: var(--kak-inset-top, env(safe-area-inset-top, 0px));
	padding-right: var(--kak-inset-right, env(safe-area-inset-right, 0px));
	padding-bottom: var(--kak-inset-bottom, env(safe-area-inset-bottom, 0px));
	padding-left: var(--kak-inset-left, env(safe-area-inset-left, 0px));
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	position: fixed;
	top: var(--kak-inset-top, env(safe-area-inset-top, 0px));
	right: var(--kak-inset-right, env(safe-area-inset-right, 0px));
	bottom: var(--kak-inset-bottom, env(safe-area-inset-bottom, 0px));
	left: var(--kak-inset-left, env(safe-area-inset-left, 0px));
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>
		<div id="kak-inset-probe"></div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":5694060,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
(function () {
	var params = new URLSearchParams(window.location.search);
	if (params.get('shots') === 'phone') {
		var size = params.get('size') || '390x844';
		GODOT_CONFIG.args = ['--', '--phone-shots', '--shot-size=' + size];
	}
	function kakReadInsets() {
		var probe = document.getElementById('kak-inset-probe');
		var cs = probe ? getComputedStyle(probe) : null;
		function n(v) {
			var x = parseFloat(v);
			return isNaN(x) ? 0 : x;
		}
		return {
			top: cs ? n(cs.paddingTop) : 0,
			right: cs ? n(cs.paddingRight) : 0,
			bottom: cs ? n(cs.paddingBottom) : 0,
			left: cs ? n(cs.paddingLeft) : 0
		};
	}
	function kakFit() {
		var inset = kakReadInsets();
		var vv = window.visualViewport;
		var w = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
		var h = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
		document.documentElement.style.height = h + 'px';
		document.body.style.width = w + 'px';
		document.body.style.height = h + 'px';
		var canvas = document.getElementById('canvas');
		if (canvas) {
			canvas.style.position = 'fixed';
			canvas.style.top = inset.top + 'px';
			canvas.style.right = inset.right + 'px';
			canvas.style.bottom = inset.bottom + 'px';
			canvas.style.left = inset.left + 'px';
			canvas.style.width = Math.max(1, Math.round(w - inset.left - inset.right)) + 'px';
			canvas.style.height = Math.max(1, Math.round(h - inset.top - inset.bottom)) + 'px';
		}
		var status = document.getElementById('status');
		if (status) {
			status.style.top = inset.top + 'px';
			status.style.right = inset.right + 'px';
			status.style.bottom = inset.bottom + 'px';
			status.style.left = inset.left + 'px';
		}
		var root = document.documentElement;
		root.style.setProperty('--kak-sal', inset.left + 'px');
		root.style.setProperty('--kak-sat', inset.top + 'px');
		root.style.setProperty('--kak-sar', inset.right + 'px');
		root.style.setProperty('--kak-sab', inset.bottom + 'px');
	}
	window.kakReadInsets = kakReadInsets;
	window.kakFit = kakFit;
	window.addEventListener('resize', kakFit);
	window.addEventListener('orientationchange', function () {
		kakFit();
		setTimeout(kakFit, 60);
		setTimeout(kakFit, 250);
	});
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', kakFit);
		window.visualViewport.addEventListener('scroll', kakFit);
	}
	kakFit();
})();
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
